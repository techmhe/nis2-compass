# Same gate the agent runs locally. Runs on every push and pull request. A version tag (v*) also builds the
# container image once the gate is green; workflow_dispatch on a tag rebuilds it.
name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    # The job runs in a container. That pins the toolchain and lets the job
    # reach the database by its service name, so no database port is published
    # on the runner.
    container: node:22.23.4-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: nis2
          POSTGRES_DB: nis2_test
          POSTGRES_HOST_AUTH_METHOD: trust
    env:
      NIS2_TEST_DATABASE_URL: postgresql+psycopg://nis2@postgres:5432/nis2_test
      # The Python the Dockerfile ships. Without a pin uv takes the newest
      # release, for which several dependencies have no wheels yet.
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # the test-tamper check diffs against main
          persist-credentials: false   # later steps run the pushed code; nothing here fetches or pushes
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.4"       # same uv as the Dockerfile; bump both together
      - run: uv sync --frozen
        working-directory: backend
      # The extensions scripts/dev-db.sh creates locally. Done with the
      # backend's own driver because the job image has no psql.
      - name: Test database extensions
        working-directory: backend
        run: |
          .venv/bin/python - <<'EOF'
          import time

          import psycopg

          for attempt in range(30):
              try:
                  conn = psycopg.connect("postgresql://nis2@postgres:5432/nis2_test", autocommit=True)
                  break
              except psycopg.OperationalError:
                  time.sleep(2)
          else:
              raise SystemExit("PostgreSQL service did not come up")
          with conn:
              for ext in ("vector", "pg_trgm", "unaccent"):
                  conn.execute(f"CREATE EXTENSION IF NOT EXISTS {ext}")
          EOF
      - run: uv tool install pip-audit==2.10.1
      - run: npm ci
        working-directory: frontend
      # A pull request build is checked out detached, so the test-tamper check
      # cannot see the branch whose plan names the changed tests. Give the
      # checkout its branch name, but only for branches of this repository,
      # whose authors can push here anyway. A fork stays detached: every
      # changed test fails there. So does a head branch called main, the one
      # name for which verify.sh skips the check.
      - name: Name the pull request branch
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.head_ref != 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: git switch -c "$HEAD_REF"
      - run: .claude/verify.sh

  image:
    needs: verify
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Two close tag runs must not reorder their pushes of the floating tags.
    concurrency:
      group: image-release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # Third-party actions are pinned to the commit of the named release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # all release tags, to find the newest one
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Two outputs, both false for pre-releases and re-runs on old tags. newest_major=true when this tag is the
      # highest stable vX.Y.Z of its own major (moves the major tag, so a patch on 1.x still reaches :1 after 2.0.0).
      # newest=true when it is the highest stable release overall (moves latest).
      - id: newest
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          stable='^v[0-9]+\.[0-9]+\.[0-9]+$'
          newest_major=false
          newest=false
          if printf '%s' "$REF_NAME" | grep -qE "$stable"; then
            major="${REF_NAME%%.*}"
            highest_major=$(git tag -l "${major}.*" --sort=-v:refname | grep -E "$stable" | sed -n 1p)
            highest=$(git tag -l 'v*' --sort=-v:refname | grep -E "$stable" | sed -n 1p)
            [ "$REF_NAME" = "$highest_major" ] && newest_major=true
            [ "$REF_NAME" = "$highest" ] && newest=true
          fi
          echo "newest_major=$newest_major" >> "$GITHUB_OUTPUT"
          echo "newest=$newest" >> "$GITHUB_OUTPUT"
      # 1.2.3 and 1.2 for every v1.2.3 tag. 1 only for the newest of its major, latest only for the newest overall (see above).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ steps.newest.outputs.newest_major == 'true' }}
            type=raw,value=latest,enable=${{ steps.newest.outputs.newest == 'true' }}
      # Provenance and SBOM are BuildKit attestations stored with the image; the signed GitHub attestation
      # follows below. No GHA cache: the verify job before it could write cache entries the release build would
      # take as layers.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  # Signed SLSA build provenance (Sigstore) for the pushed image index, stored at GitHub (see README for
  # `gh attestation verify`). A job of its own so that only this one action ever holds the OIDC signing token.
  attest:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.image.outputs.digest }}
